server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
      config:
        server-addr: localhost:8848
        file-extension: yml
    gateway:
      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # 路由规则
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: video-service
          uri: lb://video-service
          predicates:
            - Path=/api/video/**,/api/comment/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/file/**

logging:
  level:
    root: INFO
    com.syne.tiktok: DEBUG
    org.springframework.cloud.gateway: DEBUG
